<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Don Basilico - Riepilogo</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Don Basilico">
<link rel="apple-touch-icon" href="/icon-192.png">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;color:#1e293b}

/* LOGIN */
.login-bg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#0f3460 100%)}
.login-box{background:#fff;border-radius:24px;padding:36px 28px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .emoji{font-size:52px}
.login-logo h1{font-size:26px;font-weight:900;color:#0f172a;margin-top:8px}
.login-logo p{font-size:13px;color:#94a3b8;margin-top:4px}

/* SEDE LIST */
.sede-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.sede-btn{padding:14px 8px;border-radius:14px;border:2px solid #e2e8f0;background:#f8fafc;cursor:pointer;text-align:center;transition:all .15s;font-size:12px;font-weight:700;color:#475569;line-height:1.3}
.sede-btn:active,.sede-btn.selected{border-color:var(--c);background:var(--cb);color:var(--c)}
.sede-btn .sede-icon{font-size:22px;display:block;margin-bottom:4px}

/* PIN */
.pin-section{margin-top:20px}
.pin-label{font-size:12px;font-weight:700;color:#64748b;margin-bottom:10px;text-align:center;letter-spacing:.5px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:20px}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid #cbd5e1;background:#f1f5f9;transition:all .15s}
.pin-dot.filled{background:#6366f1;border-color:#6366f1}
.pin-dot.error{background:#ef4444;border-color:#ef4444}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num-btn{padding:18px 8px;border-radius:14px;border:none;background:#f1f5f9;font-size:22px;font-weight:700;color:#0f172a;cursor:pointer;transition:all .15s;-webkit-user-select:none}
.num-btn:active{background:#e2e8f0;transform:scale(.96)}
.num-btn.del{font-size:18px;color:#94a3b8}
.num-btn.empty{background:transparent;pointer-events:none}
.back-btn{width:100%;margin-top:14px;padding:12px;border-radius:10px;border:none;background:#f1f5f9;color:#64748b;font-size:14px;font-weight:700;cursor:pointer}
.err-msg{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;font-size:13px;text-align:center;margin-bottom:12px}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh;background:#f8fafc}
.topbar{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0;background:#fff;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.topbar-info{display:flex;align-items:center;gap:10px}
.topbar-emoji{font-size:24px}
.topbar-title{font-size:15px;font-weight:800;color:#0f172a}
.topbar-sede{font-size:11px;font-weight:700;margin-top:1px}
.logout-btn{padding:7px 14px;border-radius:10px;border:1px solid #e2e8f0;background:transparent;color:#64748b;font-size:12px;cursor:pointer;font-weight:700}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0}
.tab{flex:1;padding:13px 6px;text-align:center;font-size:12px;font-weight:700;color:#94a3b8;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tab.active{color:#6366f1;border-bottom-color:#6366f1;background:#f8fafc}
.content{padding:16px 14px 80px;flex:1}

/* CARDS */
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card-title{font-size:11px;font-weight:800;color:#94a3b8;margin-bottom:14px;text-transform:uppercase;letter-spacing:.8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.fl{font-size:10px;font-weight:700;color:#64748b;margin-bottom:4px;letter-spacing:.3px}
.fi{width:100%;padding:10px 10px;border-radius:10px;border:1.5px solid #e2e8f0;background:#f8fafc;color:#1e293b;font-size:15px;outline:none;transition:border .2s;-webkit-appearance:none}
.fi:focus{border-color:#6366f1}
textarea.fi{resize:vertical}
.save-btn{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:16px;font-weight:900;cursor:pointer;margin-top:4px;letter-spacing:.3px}
.save-btn:active{opacity:.85}

/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border-radius:14px;padding:16px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stat-val{font-size:20px;font-weight:900;color:#0f172a}
.stat-lbl{font-size:10px;color:#64748b;margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.stat-sub{font-size:11px;color:#94a3b8;margin-top:2px}
.row-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #1e293b}
.row-item:last-child{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:13px 24px;border-radius:14px;font-weight:800;font-size:14px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap;transition:opacity .3s}
</style>
</head>

// Direct REST API - no supabase client needed
async function dbSelect(table, params={}) {
  const qp = ['select=*'];
  if(params.eq) Object.entries(params.eq).forEach(([k,v]) => qp.push(`${k}=eq.${encodeURIComponent(v)}`));
  if(params.order) qp.push(`order=${params.order}`);
  if(params.limit) qp.push(`limit=${params.limit}`);
  const url = `${SUPA_URL}/rest/v1/${table}?${qp.join('&')}`;
  const r = await fetch(url, { headers: {
    'apikey': SUPA_KEY,
    'Authorization': `Bearer ${SUPA_KEY}`
  }});
  const text = await r.text();
  if(!r.ok) throw new Error(text);
  return JSON.parse(text);
}

async function dbUpsert(table, row) {
  // Prima DELETE poi INSERT per evitare problemi con upsert
  const delUrl = SUPA_URL+'/rest/v1/'+table+'?pizzeria=eq.'+encodeURIComponent(row.pizzeria)+'&date=eq.'+row.date;
  await fetch(delUrl, {
    method: 'DELETE',
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer '+SUPA_KEY,
      'Content-Profile': 'public'
    }
  });
  const insUrl = SUPA_URL+'/rest/v1/'+table;
  const r = await fetch(insUrl, {
    method: 'POST',
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer '+SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(row)
  });
  if(r.status >= 400) { const e=await r.text(); throw new Error(e); }
  return {};
}

// ─── STATS ────────────────────────────────────────────────────────────────────
let statsPeriod = 'mese';
let statsCustomFrom = '';
let statsCustomTo = '';

function getPeriodDates(period) {
  const now = new Date();
  const to = now.toISOString().slice(0,10);
  let from;
  if(period==='7gg')    { const d=new Date(now); d.setDate(d.getDate()-7);      from=d.toISOString().slice(0,10); }
  else if(period==='mese')  { const d=new Date(now); d.setDate(d.getDate()-30);     from=d.toISOString().slice(0,10); }
  else if(period==='3mesi') { const d=new Date(now); d.setMonth(d.getMonth()-3);    from=d.toISOString().slice(0,10); }
  else if(period==='anno')  { const d=new Date(now); d.setFullYear(d.getFullYear()-1); from=d.toISOString().slice(0,10); }
  else if(period==='tutto') { from='2020-01-01'; }
  else if(period==='custom'){ from=statsCustomFrom; }
  return {from, to: period==='custom' ? statsCustomTo : to};
}

function svgLine(rows, valFn, color, W=320, H=100){
  if(rows.length<2) return '';
  const vals = rows.map(valFn);
  const maxV = Math.max(...vals,1);
  const PAD=8;
  const pts = rows.map((r,i)=>{
    const x=PAD+(i/(rows.length-1))*(W-PAD*2);
    const y=H-PAD-(vals[i]/maxV)*(H-PAD*2);
    return `${x},${y}`;
  }).join(' ');
  const area = `${PAD},${H-PAD} ${pts} ${W-PAD},${H-PAD}`;
  const id = 'g'+Math.random().toString(36).slice(2,6);
  // Labels: first, middle, last
  const labelIdxs = [0, Math.floor(rows.length/2), rows.length-1];
  const labels = labelIdxs.map(i=>{
    const x=PAD+(i/(rows.length-1))*(W-PAD*2);
    return `<text x="${x}" y="${H+2}" font-size="8" fill="#94a3b8" text-anchor="middle">${rows[i].date.slice(5)}</text>`;
  }).join('');
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
  </linearGradient></defs>
  <polygon points="${area}" fill="url(#${id})"/>
  <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
  ${labels}`;
}

  try {
    const params = {order:'date.asc', limit:500};
    if(!isAdmin) params.eq = {pizzeria: DB_NAME[currentSede.id]};
    rows = await dbSelect('riepilogo_daily', params);
    rows = rows.filter(r => r.date >= from && r.date <= to);
  } catch(e) {
    $('mainContent').innerHTML = periodHtml + `<div class="card"><p style="color:#ef4444">${e.message}</p></div>`;
    return;
  }

  if(!rows.length){
    $('mainContent').innerHTML = periodHtml + '<div class="card" style="text-align:center;padding:40px;color:#64748b">Nessun dato nel periodo selezionato</div>';
    return;
  }

  // ── CALCOLI ──
  const totInc     = rows.reduce((s,r)=>s+(parseFloat(r.incasso)||0),0);
  const totIncJE   = rows.reduce((s,r)=>s+(parseFloat(r.incasso_just_eat)||0),0);
  const totIncTot  = totInc + totIncJE;
  const totPizze   = rows.reduce((s,r)=>s+(parseInt(r.pizze_piatto)||0),0);
  const totPizPiz  = rows.reduce((s,r)=>s+(parseInt(r.pizze_pizzeria)||0),0);
  const totPizJE   = rows.reduce((s,r)=>s+(parseInt(r.pizze_just_eat)||0),0);
  const totPizMaxi = rows.reduce((s,r)=>s+(parseInt(r.pizze_maxi)||0),0);
  const totPizBaby = rows.reduce((s,r)=>s+(parseInt(r.pizze_baby)||0),0);
  const totConsPiz = rows.reduce((s,r)=>s+(parseInt(r.consegne_pizzeria)||0),0);
  const totConsJE  = rows.reduce((s,r)=>s+(parseInt(r.consegne_just_eat)||0),0);
  const totSpese   = rows.reduce((s,r)=>s+(parseFloat(r.spese)||0),0);
  const totComande = rows.reduce((s,r)=>s+(parseInt(r.comande_pv)||0),0);
  const giorni     = rows.length;
  const mediaGiorno = giorni>0 ? totIncTot/giorni : 0;
  const vmPizza    = totPizze>0 ? totIncTot/totPizze : 0;
  const bnAvg      = rows.reduce((s,r)=>{
    const inc=parseFloat(r.incasso)||0, cf=parseFloat(r.chiusura_fiscale)||0;
    return s+(cf>0?Math.abs((inc-cf)/cf*100):0);
  },0) / Math.max(giorni,1);

  let html = periodHtml;

  // ── KPI PRINCIPALI ──
  html += `<div class="stat-grid">
    <div class="stat-card" style="border-color:#6366f133">
      <div class="stat-val" style="color:#6366f1">€${fmt(totIncTot)}</div>
      <div class="stat-lbl">Incasso Totale</div><div class="stat-sub">${giorni} giorni</div>
    </div>
    <div class="stat-card" style="border-color:#10b98133">
      <div class="stat-val" style="color:#10b981">€${fmt(mediaGiorno)}</div>
      <div class="stat-lbl">Media/Giorno</div>
    </div>
    <div class="stat-card" style="border-color:#f59e0b33">
      <div class="stat-val" style="color:#f59e0b">€${fmt(totInc)}</div>
      <div class="stat-lbl">Incasso Pizzeria</div>
    </div>
    <div class="stat-card" style="border-color:#ef444433">
      <div class="stat-val" style="color:#ef4444">€${fmt(totIncJE)}</div>
      <div class="stat-lbl">Incasso Just Eat</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${fmt(totPizze)}</div>
      <div class="stat-lbl">Pizze Totali</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">€${vmPizza.toFixed(2)}</div>
      <div class="stat-lbl">Valore Medio Pizza</div>
    </div>
    <div class="stat-card" style="border-color:${bnAvg<30?'#10b98133':'#ef444433'}">
      <div class="stat-val" style="color:${bnAvg<30?'#10b981':'#ef4444'}">${bnAvg.toFixed(1)}%</div>
      <div class="stat-lbl">B/N Medio</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">€${fmt(totSpese)}</div>
      <div class="stat-lbl">Spese Totali</div>
    </div>
  </div>`;

  // ── GRAFICO INCASSO ──
  if(rows.length>1){
    const W=320,H=110;
    html += `<div class="card">
      <div class="card-title">📈 Incasso nel Tempo</div>
      <svg viewBox="0 0 ${W} ${H+12}" style="width:100%;overflow:visible">
        ${svgLine(rows,r=>(parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0),'#6366f1',W,H)}
      </svg>
    </div>`;
  }

  // ── GRAFICI PIZZE ──
  if(rows.length>1){
    const W=320,H=90;
    html += `<div class="card">
      <div class="card-title">🍕 Pizze nel Tempo</div>
      <div style="display:flex;gap:12px;margin-bottom:8px;flex-wrap:wrap">
        <span style="font-size:11px;font-weight:700;color:#f59e0b">● Pizzeria</span>
        <span style="font-size:11px;font-weight:700;color:#ef4444">● Just Eat</span>
      </div>
      <svg viewBox="0 0 ${W} ${H+12}" style="width:100%;overflow:visible">
        ${svgLine(rows,r=>parseInt(r.pizze_pizzeria)||0,'#f59e0b',W,H)}
        ${svgLine(rows,r=>parseInt(r.pizze_just_eat)||0,'#ef4444',W,H)}
      </svg>
    </div>`;
  }

  // ── DETTAGLIO PIZZE ──
  html += `<div class="card">
    <div class="card-title">🍕 Dettaglio Pizze</div>
    <div class="row-item"><span style="color:#64748b;font-size:13px">Pizze Pizzeria</span><span style="font-weight:800;color:#0f172a">${fmt(totPizPiz)}</span></div>
    <div class="row-item"><span style="color:#64748b;font-size:13px">Pizze Just Eat</span><span style="font-weight:800;color:#0f172a">${fmt(totPizJE)}</span></div>
    <div class="row-item"><span style="color:#64748b;font-size:13px">Pizze Maxi</span><span style="font-weight:800;color:#0f172a">${fmt(totPizMaxi)}</span></div>
    <div class="row-item"><span style="color:#64748b;font-size:13px">Pizze Baby</span><span style="font-weight:800;color:#0f172a">${fmt(totPizBaby)}</span></div>
    <div class="row-item"><span style="color:#64748b;font-size:13px">Consegne Pizzeria</span><span style="font-weight:800;color:#0f172a">${fmt(totConsPiz)}</span></div>
    <div class="row-item"><span style="color:#64748b;font-size:13px">Consegne Just Eat</span><span style="font-weight:800;color:#0f172a">${fmt(totConsJE)}</span></div>
    <div class="row-item"><span style="color:#64748b;font-size:13px">Comande PV</span><span style="font-weight:800;color:#0f172a">${fmt(totComande)}</span></div>
  </div>`;

  // ── SPESE PER CATEGORIA ──
  const spesePerCat = {};
  rows.forEach(r=>{
    try {
      const det = typeof r.spese_dettaglio==='string' ? JSON.parse(r.spese_dettaglio) : (r.spese_dettaglio||[]);
      det.forEach(s=>{ spesePerCat[s.cat]=(spesePerCat[s.cat]||0)+(parseFloat(s.val)||0); });
    } catch(e){}
  });
  if(Object.keys(spesePerCat).length>0){
    html += `<div class="card"><div class="card-title">💸 Spese per Categoria</div>`;
    const maxSpesa = Math.max(...Object.values(spesePerCat),1);
    Object.entries(spesePerCat).sort((a,b)=>b[1]-a[1]).forEach(([cat,val])=>{
      const pct = val/maxSpesa*100;
      html += `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:12px;font-weight:700;color:#1e293b">${cat}</span>
          <span style="font-size:12px;font-weight:900;color:#1e293b">€${fmt(val)}</span>
        </div>
        <div style="background:#f1f5f9;border-radius:6px;height:6px">
          <div style="background:#6366f1;width:${pct}%;height:100%;border-radius:6px"></div>
        </div>
      </div>`;
    });
    html += `<div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid #f1f5f9">
      <span style="font-size:12px;font-weight:700;color:#64748b">TOTALE</span>
      <span style="font-size:14px;font-weight:900;color:#6366f1">€${fmt(totSpese)}</span>
    </div></div>`;
  }

  // ── CONFRONTO SEDI (admin) ──
  if(isAdmin){
    html += `<div class="card"><div class="card-title">🏪 Confronto Sedi</div>`;
    const sedeStats = SEDI.filter(s=>!s.admin).map(s=>{
      const r2=rows.filter(r=>r.pizzeria===DB_NAME[s.id]);
      const inc=r2.reduce((a,r)=>a+(parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0),0);
      const pizze=r2.reduce((a,r)=>a+(parseInt(r.pizze_piatto)||0),0);
      const spese=r2.reduce((a,r)=>a+(parseFloat(r.spese)||0),0);
      return {s, inc, pizze, spese, giorni:r2.length};
    }).sort((a,b)=>b.inc-a.inc);
    const maxInc = Math.max(...sedeStats.map(x=>x.inc),1);
    sedeStats.forEach(({s,inc,pizze,spese,giorni:gg})=>{
      if(!gg) return;
      const pct=inc/maxInc*100;
      html+=`<div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:13px;font-weight:700;color:#0f172a">${s.emoji} ${s.name}</span>
          <span style="font-size:13px;font-weight:900;color:#0f172a">€${fmt(inc)}</span>
        </div>
        <div style="background:#f1f5f9;border-radius:6px;height:8px;margin-bottom:4px">
          <div style="background:${s.color};width:${pct}%;height:100%;border-radius:6px"></div>
        </div>
        <div style="display:flex;gap:12px;font-size:10px;color:#64748b">
          <span>${gg}gg</span>
          <span>media €${fmt(gg>0?inc/gg:0)}/gg</span>
          <span>${fmt(pizze)} pizze</span>
          <span>spese €${fmt(spese)}</span>
        </div>
      </div>`;
    });
    html += '</div>';

    // ── GRAFICO CONFRONTO INCASSO SEDI ──
    if(rows.length>1){
      const W=320,H=110;
      html += `<div class="card">
        <div class="card-title">📊 Incasso Sedi nel Tempo</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
          ${SEDI.filter(s=>!s.admin).map(s=>`<span style="font-size:10px;font-weight:700;color:${s.color}">● ${s.name.replace('Don Basilico - ','')}</span>`).join('')}
        </div>
        <svg viewBox="0 0 ${W} ${H+12}" style="width:100%;overflow:visible">
          ${SEDI.filter(s=>!s.admin).map(s=>{
            const r2=rows.filter(r=>r.pizzeria===DB_NAME[s.id]);
            if(r2.length<2) return '';
            return svgLine(r2,r=>(parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0),s.color,W,H);
          }).join('')}
        </svg>
      </div>`;
    }
  }

  // ── ULTIMI INSERIMENTI ──
  html += `<div class="card"><div class="card-title">🕐 Ultimi Inserimenti</div>`;
  [...rows].reverse().slice(0,10).forEach(r=>{
    const sede=SEDI.find(s=>DB_NAME[s.id]===r.pizzeria)||{color:'#6366f1',emoji:'🍕',name:r.pizzeria};
    const inc=(parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0);
    const pizze=parseInt(r.pizze_piatto)||0;
    const bn = (parseFloat(r.chiusura_fiscale)||0)>0 ? Math.abs(((parseFloat(r.incasso)||0)-(parseFloat(r.chiusura_fiscale)||0))/(parseFloat(r.chiusura_fiscale)||1)*100) : 0;
    html+=`<div class="row-item">
      <div>
        <div style="font-size:13px;font-weight:800;color:#0f172a">${r.date}</div>
        ${isAdmin?`<span class="badge" style="background:${sede.color}22;color:${sede.color}">${sede.emoji} ${sede.name.replace('Don Basilico - ','')}</span>`:''}
      </div>
      <div style="text-align:right">
        <div style="font-weight:900;color:#0f172a">€${fmt(inc)}</div>
        <div style="font-size:11px;color:#64748b">${fmt(pizze)} pizze · B/N <span style="color:${bn<30?'#10b981':'#ef4444'};font-weight:700">${bn.toFixed(1)}%</span></div>
      </div>
    </div>`;
  });
  html += '</div>';

  $('mainContent').innerHTML = html;
}

// ─── SPESE GLOBALI ───────────────────────────────────────────────────────────
const CATEGORIE_SPESE = ['Natural','Tutto Carta','Bevande','Verdura','Fritti','Salsiccia','Stipendi','Contado','Mozzarella','Altro'];
let speseItems = [];

function renderSpese(){
  const list = $('speseList');
  if(!list) return;
  if(speseItems.length===0){
    list.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:13px;padding:12px 0">Nessuna spesa aggiunta</div>';
  } else {
    let html = '';
    for(let i=0;i<speseItems.length;i++){
      const s = speseItems[i];
      const opts = CATEGORIE_SPESE.map(c=>'<option value="'+c+'"'+(s.cat===c?' selected':'')+'>'+c+'</option>').join('');
      html += '<div style="margin-bottom:10px">';
      html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:'+(s.cat==='Altro'?'6px':'0')+'">';
      html += '<select onchange="speseItems['+i+'].cat=this.value;renderSpese()" style="flex:1.5;padding:8px;border-radius:8px;border:1.5px solid #e2e8f0;background:#f8fafc;color:#1e293b;font-size:13px;font-weight:600;outline:none">'+opts+'</select>';
      html += '<input type="number" value="'+(s.val||0)+'" placeholder="0.00" step="0.01" inputmode="decimal"';
      html += ' onchange="speseItems['+i+'].val=parseNum(this.value);updateSpeseTotal()"';
      html += ' oninput="speseItems['+i+'].val=parseNum(this.value);updateSpeseTotal()"';
      html += ' style="flex:1;padding:8px;border-radius:8px;border:1.5px solid #e2e8f0;background:#f8fafc;color:#1e293b;font-size:14px;font-weight:700;outline:none;width:0">';
      html += '<button onclick="removeSpesa('+i+')" style="padding:6px 10px;border-radius:8px;border:none;background:#fee2e2;color:#ef4444;font-size:14px;cursor:pointer;font-weight:800;flex-shrink:0">✕</button>';
      html += '</div>';
      if(s.cat==='Altro'){
        html += '<input type="text" value="'+(s.desc||'')+'" placeholder="Descrivi la spesa..."';
        html += ' onchange="speseItems['+i+'].desc=this.value"';
        html += ' oninput="speseItems['+i+'].desc=this.value"';
        html += ' style="width:100%;padding:8px;border-radius:8px;border:1.5px solid #6366f1;background:#f0f0ff;color:#1e293b;font-size:13px;outline:none;box-sizing:border-box">';
      }
      html += '</div>';
    }
    list.innerHTML = html;
  }
  updateSpeseTotal();
}

function addSpesa(){
  speseItems.push({cat:'Natural', val:0});
  renderSpese();
}

function removeSpesa(i){
  speseItems.splice(i,1);
  renderSpese();
}

function updateSpeseTotal(){
  const tot = speseItems.reduce((s,x)=>s+(parseFloat(x.val)||0),0);
  const el = $('speseTotal');
  if(el) el.textContent = '€ ' + tot.toFixed(2);
}

function getSpeseTotal(){
  return speseItems.reduce((s,x)=>s+(parseFloat(x.val)||0),0);
}

      <span id="speseTotal" style="font-size:18px;font-weight:900;color:#4338ca">€ 0.00</span>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Note</div>
    <textarea class="fi" id="f_note" rows="3" placeholder="Note del giorno..."></textarea>
  </div>
  <button class="save-btn" id="saveBtn" onclick="saveForm()">💾 Salva Riepilogo</button>`;

  speseItems = [];
  renderSpese();

  // Auto-calc totale pizze
  const calcFields = ['f_pizze_je','f_pizze','f_num_pizze_pv','f_pizze_baby','f_pizze_maxi','f_pizze_sala'];
  function calcTotale(){
    const je    = parseInt2($('f_pizze_je')?.value);
    const cons  = parseInt2($('f_pizze')?.value);
    const pv    = parseInt2($('f_num_pizze_pv')?.value);
    const baby  = parseInt2($('f_pizze_baby')?.value);
    const maxi  = parseInt2($('f_pizze_maxi')?.value);
    const sala  = parseInt2($('f_pizze_sala')?.value);
    const tot = je + cons + pv + baby + (maxi * 2) + sala;
    if($('f_tot_pizze')) $('f_tot_pizze').textContent = tot;
    // Valore medio pizza = (incasso + incasso JE) / totale pizze giornaliero
    const incasso = parseNum($('f_inc')?.value) + parseNum($('f_inc_je')?.value);
    const vm = tot > 0 ? (incasso / tot) : 0;
    if($('f_valore_medio')) $('f_valore_medio').textContent = '€ ' + vm.toFixed(2);
    // B/N = (incasso - chiusura fiscale) / chiusura fiscale * 100
    const chiusura = parseNum($('f_imp')?.value);
    const bn = chiusura > 0 ? Math.abs((incasso - chiusura) / chiusura * 100) : 0;
    const bnEl = $('f_bn');
    if(bnEl) {
      bnEl.textContent = bn.toFixed(2) + '%';
      if(bn < 30) {
        bnEl.style.borderColor='#10b981'; bnEl.style.background='#f0fdf4'; bnEl.style.color='#047857';
      } else {
        bnEl.style.borderColor='#ef4444'; bnEl.style.background='#fef2f2'; bnEl.style.color='#991b1b';
      }
    }
  }
  const allCalcFields = [...calcFields, 'f_inc', 'f_inc_je', 'f_imp'];
  allCalcFields.forEach(id => {
    const el = $(id);
    if(el){ 
      el.addEventListener('input', calcTotale);
      el.addEventListener('change', calcTotale);
    }
  });
  calcTotale();
}

async function saveForm(){
  const btn=$('saveBtn'); btn.disabled=true; btn.textContent='Salvataggio...';
  const sedeId = currentSede.admin ? $('f_sede').value : currentSede.id;

  // Blocco 48h per i gestori (non admin) — basato su created_at del record
  if(!currentSede.admin) {
    const sedeId2 = currentSede.id;
    const dateVal = $('f_date').value;
    try {
      const existing = await dbSelect('riepilogo_daily', {eq:{pizzeria:DB_NAME[sedeId2],date:dateVal}});

        const now = new Date();
        const diffHours = (now - createdAt) / (1000 * 60 * 60);

          toast('⛔ Salvato da oltre 48h — solo Admin può modificare', '#ef4444');

    pizze_maxi: parseInt2($('f_pizze_maxi').value),
    pizze_baby: parseInt2($('f_pizze_baby').value),
    consegne_just_eat: parseInt2($('f_cons_je').value),

    pizze_pizzeria: parseInt2($('f_pizze').value),
    pizze_just_eat: parseInt2($('f_pizze_je').value),

function renderCalendario(rows){
  const oggi = new Date();
  const mesi = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const giorniSettimana = ['Lu','Ma','Me','Gi','Ve','Sa','Do'];

  // Set date inserite
  const dateInserite = new Set(rows.map(r=>r.date));

  let html = '';

  // Naviga tra mesi
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <button onclick="storicoCalMonth--;if(storicoCalMonth<0){storicoCalMonth=11;storicoCalYear--;}renderStorico(false)" 
      style="padding:8px 16px;border-radius:10px;border:none;background:#f1f5f9;color:#64748b;font-weight:800;cursor:pointer;font-size:16px">‹</button>
    <div style="font-size:16px;font-weight:900;color:#0f172a">${mesi[storicoCalMonth]} ${storicoCalYear}</div>
    <button onclick="storicoCalMonth++;if(storicoCalMonth>11){storicoCalMonth=0;storicoCalYear++;}renderStorico(false)"
      style="padding:8px 16px;border-radius:10px;border:none;background:#f1f5f9;color:#64748b;font-weight:800;cursor:pointer;font-size:16px">›</button>
  </div>`;

  // Legenda
  html += `<div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap">
    <span style="font-size:11px;font-weight:700;color:#10b981">🟢 Inserito</span>
    <span style="font-size:11px;font-weight:700;color:#ef4444">🔴 Mancante</span>
    <span style="font-size:11px;font-weight:700;color:#94a3b8">⚪ Futuro</span>
  </div>`;

  // Griglia giorni settimana
  html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">
    ${giorniSettimana.map(g=>`<div style="text-align:center;font-size:11px;font-weight:700;color:#94a3b8;padding:4px">${g}</div>`).join('')}
  </div>`;

  // Giorni del mese
  const primoGiorno = new Date(storicoCalYear, storicoCalMonth, 1);
  const ultimoGiorno = new Date(storicoCalYear, storicoCalMonth+1, 0);
  const startDay = (primoGiorno.getDay()+6)%7; // Lunedì = 0
  const totDays = ultimoGiorno.getDate();

  html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">`;

  // Celle vuote prima del mese
  for(let i=0;i<startDay;i++){
    html += `<div></div>`;
  }

  for(let d=1;d<=totDays;d++){
    const dateStr = `${storicoCalYear}-${String(storicoCalMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dataGiorno = new Date(storicoCalYear, storicoCalMonth, d);
    const isFuturo = dataGiorno > oggi;
    const isOggi = dataGiorno.toDateString()===oggi.toDateString();
    const isInserito = dateInserite.has(dateStr);
    const isMancante = !isFuturo && !isInserito;

    let bg, color, border;
    if(isFuturo)      { bg='#f8fafc'; color='#cbd5e1'; border='#e2e8f0'; }
    else if(isInserito){ bg='#dcfce7'; color='#166534'; border='#86efac'; }
    else               { bg='#fee2e2'; color='#991b1b'; border='#fca5a5'; }
    if(isOggi)         { border='#6366f1'; }

    const row = rows.find(r=>r.date===dateStr);
    const incasso = row ? (parseFloat(row.incasso)||0)+(parseFloat(row.incasso_just_eat)||0) : 0;

    html += `<div onclick="${isInserito?`loadForEdit('${row?.pizzeria}','${dateStr}')`:isMancante?`loadNewForm('${dateStr}')`:''}" 
      style="border-radius:8px;border:2px solid ${border};background:${bg};padding:6px 4px;text-align:center;cursor:${isFuturo?'default':'pointer'};min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:13px;font-weight:${isOggi?'900':'700'};color:${color}">${d}</div>
      ${isInserito?`<div style="font-size:9px;font-weight:700;color:#166534;margin-top:2px">€${fmt(incasso)}</div>`:''}
      ${isMancante?`<div style="font-size:9px;color:#ef4444;margin-top:2px">!</div>`:''}
    </div>`;
  }
  html += '</div>';

  // Riepilogo mese
  const dateDelMese = [...dateInserite].filter(d=>d.startsWith(`${storicoCalYear}-${String(storicoCalMonth+1).padStart(2,'0')}`));
  const giorniPassati = Array.from({length:Math.min(oggi.getDate(), oggi.getMonth()===storicoCalMonth&&oggi.getFullYear()===storicoCalYear?oggi.getDate():totDays)}, (_,i)=>i+1).length;
  const mancanti = giorniPassati - dateDelMese.length;
  const incMese = rows.filter(r=>r.date.startsWith(`${storicoCalYear}-${String(storicoCalMonth+1).padStart(2,'0')}`))
    .reduce((s,r)=>s+(parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0),0);

  html += `<div class="card" style="margin-top:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div style="text-align:center"><div style="font-size:18px;font-weight:900;color:#10b981">${dateDelMese.length}</div><div style="font-size:10px;color:#64748b;font-weight:700">INSERITI</div></div>
      <div style="text-align:center"><div style="font-size:18px;font-weight:900;color:#ef4444">${Math.max(0,mancanti)}</div><div style="font-size:10px;color:#64748b;font-weight:700">MANCANTI</div></div>
      <div style="text-align:center"><div style="font-size:18px;font-weight:900;color:#6366f1">€${fmt(incMese)}</div><div style="font-size:10px;color:#64748b;font-weight:700">INCASSO MESE</div></div>
    </div>
  </div>`;

  return html;
}

async function loadForEdit(pizzeria, date){
  // Carica i dati nel form per modifica
  const rows = await dbSelect('riepilogo_daily', {eq:{pizzeria, date}});
  if(!rows||!rows.length) return;
  const r = rows[0];
  showTab('form');
  setTimeout(()=>{
    if($('f_date')) $('f_date').value = r.date;
    if($('f_sede') && currentSede.admin) $('f_sede').value = SEDI.find(s=>DB_NAME[s.id]===r.pizzeria)?.id || '';
    // POS
    if($('f_dom')) $('f_dom').value = r.pos_domicilio||0;
    if($('f_je'))  $('f_je').value  = r.pos_just_eat||0;
    if($('f_piz')) $('f_piz').value = r.pos_pizzeria||0;
    if($('f_ann')) $('f_ann').value = r.annullati||0;
    // Produzione
    if($('f_pizze_maxi'))  $('f_pizze_maxi').value  = r.pizze_maxi||0;
    if($('f_pizze_baby'))  $('f_pizze_baby').value  = r.pizze_baby||0;
    if($('f_cons_je'))     $('f_cons_je').value     = r.consegne_just_eat||0;
    if($('f_cons_piz'))    $('f_cons_piz').value    = r.consegne_pizzeria||0;
    if($('f_pizze'))       $('f_pizze').value       = r.pizze_pizzeria||0;
    if($('f_pizze_je'))    $('f_pizze_je').value    = r.pizze_just_eat||0;
    if($('f_comande_pv'))  $('f_comande_pv').value  = r.comande_pv||0;
    if($('f_num_pizze_pv'))$('f_num_pizze_pv').value= r.num_pizze_pv||0;
    if($('f_pizze_sala'))   $('f_pizze_sala').value    = r.pizze_sala||0;
    // Cassa

let ordineAttivo = {};
let ordineNote = {};
let fornitoreSelezionato = null;

function renderOrdini(){
  const sedeName = currentSede.admin ? 'Admin' : (DB_NAME[currentSede.id]||currentSede.name);
  const shor = sedeName.replace('Don Basilico - ','');
  let html = '';

  // Griglia fornitori
  html += '<div class="card"><div class="card-title">Seleziona Fornitore</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  for(let i=0;i<FORNITORI.length;i++){
    const f=FORNITORI[i];
    const sel=fornitoreSelezionato===f.id;
    const hasProd=ordineAttivo[f.id]&&Object.values(ordineAttivo[f.id]).some(v=>v>0);
    const border=sel?'#6366f1':'#e2e8f0';
    const bg=sel?'#f0f0ff':'#f8fafc';
    const col=sel?'#6366f1':'#475569';
    html += '<button onclick="selectFornitore(\'' + f.id + '\')" ';
    html += 'style="padding:14px 8px;border-radius:12px;border:2px solid '+border+';background:'+bg+';cursor:pointer;text-align:center">';
    html += '<div style="font-size:24px">'+f.emoji+'</div>';
    html += '<div style="font-size:12px;font-weight:700;color:'+col+';margin-top:4px">'+f.nome+'</div>';
    if(hasProd) html += '<div style="font-size:10px;color:#10b981;font-weight:700;margin-top:2px">✓ Selezionati</div>';
    html += '</button>';
  }
  html += '</div></div>';

  // Prodotti fornitore selezionato
  if(fornitoreSelezionato){
    const f=FORNITORI.find(x=>x.id===fornitoreSelezionato);
    if(f){
      if(!ordineAttivo[f.id]) ordineAttivo[f.id]={};
      html += '<div class="card"><div class="card-title">'+f.emoji+' '+f.nome+' — Prodotti</div>';
      for(let i=0;i<f.prodotti.length;i++){
        const p=f.prodotti[i];
        const q=ordineAttivo[f.id][p.id]||0;
        const fid="'" + f.id + "'";
        const pid="'" + p.id + "'";
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9">';
        html += '<div><div style="font-size:13px;font-weight:700;color:#0f172a">'+p.nome+'</div>';
        html += '<div style="font-size:11px;color:#94a3b8">'+p.um+'</div></div>';
        html += '<div style="display:flex;align-items:center;gap:8px">';
        html += '<button onclick="cambiaQta('+fid+','+pid+',-1)" style="width:32px;height:32px;border-radius:8px;border:none;background:#f1f5f9;font-size:18px;font-weight:800;cursor:pointer;color:#64748b">−</button>';
        html += '<span id="qta_'+f.id+'_'+p.id+'" style="font-size:16px;font-weight:900;color:#0f172a;min-width:28px;text-align:center">'+q+'</span>';
        html += '<button onclick="cambiaQta('+fid+','+pid+',1)" style="width:32px;height:32px;border-radius:8px;border:none;background:#6366f1;font-size:18px;font-weight:800;cursor:pointer;color:#fff">+</button>';
        html += '</div></div>';
      }
      html += '<div style="margin-top:12px">';
      html += '<div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px">NOTE PER IL FORNITORE</div>';
      html += '<textarea id="note_'+f.id+'" placeholder="Es: consegna mattina, chiamare prima..." ';
      html += 'style="width:100%;padding:10px;border-radius:10px;border:1.5px solid #e2e8f0;background:#f8fafc;color:#1e293b;font-size:13px;resize:none;outline:none;box-sizing:border-box" rows="2">';
      html += (ordineNote[f.id]||'')+'</textarea>';
      html += '</div></div>';
    }
  }

  // Riepilogo e bottoni WhatsApp
  const righe=[];
  for(let i=0;i<FORNITORI.length;i++){
    const f=FORNITORI[i];
    if(!ordineAttivo[f.id]) continue;
    for(let j=0;j<f.prodotti.length;j++){
      const p=f.prodotti[j];
      const q=ordineAttivo[f.id][p.id]||0;
      if(q>0) righe.push({fornitore:f,prodotto:p,qta:q});
    }
  }

  if(righe.length>0){
    const perFornitore={};
    for(let i=0;i<righe.length;i++){
      const r=righe[i];
      if(!perFornitore[r.fornitore.id]) perFornitore[r.fornitore.id]={f:r.fornitore,righe:[]};
      perFornitore[r.fornitore.id].righe.push(r);
    }
    html += '<div class="card" style="border-color:#10b98133">';
    html += '<div class="card-title" style="color:#10b981">🛒 Riepilogo Ordine</div>';
    const keys=Object.keys(perFornitore);
    for(let i=0;i<keys.length;i++){
      const obj=perFornitore[keys[i]];
      html += '<div style="margin-bottom:12px">';
      html += '<div style="font-size:12px;font-weight:800;color:#64748b;margin-bottom:6px">'+obj.f.emoji+' '+obj.f.nome+'</div>';
      for(let j=0;j<obj.righe.length;j++){
        const r=obj.righe[j];
        html += '<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0">';
        html += '<span style="color:#0f172a">'+r.prodotto.nome+'</span>';
        html += '<span style="font-weight:800;color:#6366f1">'+r.qta+' '+r.prodotto.um+'</span></div>';
      }
      html += '</div>';
    }
    // Salva nota del fornitore attualmente visibile
    if(fornitoreSelezionato){
      const activeNote=document.getElementById('note_'+fornitoreSelezionato);
      if(activeNote) ordineNote[fornitoreSelezionato]=activeNote.value;
    }
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">';
    for(let i=0;i<keys.length;i++){
      const obj=perFornitore[keys[i]];
      const nota=ordineNote[obj.f.id]?'\n\n📝 Note: '+ordineNote[obj.f.id]:'';
      let msgTxt='Ciao, ordine per '+shor+':\n\n';
      for(let j=0;j<obj.righe.length;j++){
        msgTxt+='- '+obj.righe[j].prodotto.nome+': '+obj.righe[j].qta+' '+obj.righe[j].prodotto.um+'\n';
      }
      msgTxt+=nota+'\nGrazie!';
      const tel=obj.f.tel||'';
      const msg=encodeURIComponent(msgTxt);
      html+='<button onclick="window.open(\'https://wa.me/'+tel+'?text='+msg+'\',\'_blank\')" ';
      html+='style="flex:1;min-width:120px;padding:12px 8px;border-radius:12px;border:none;background:#25D366;color:#fff;font-size:13px;font-weight:800;cursor:pointer">';
      html+='📱 WhatsApp '+obj.f.emoji+' '+obj.f.nome+'</button>';
    }
    html+='</div>';
    html+='<button onclick="resetOrdine()" style="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:none;background:#fee2e2;color:#ef4444;font-size:13px;font-weight:800;cursor:pointer">🗑️ Azzera ordine</button>';
    html+='</div>';
  }

  $('mainContent').innerHTML=html;
}

function selectFornitore(id){
  // Salva note del fornitore corrente prima di cambiare
  if(fornitoreSelezionato){
    const noteEl = document.getElementById(`note_${fornitoreSelezionato}`);
    if(noteEl) ordineNote[fornitoreSelezionato] = noteEl.value;
  }
  fornitoreSelezionato = fornitoreSelezionato===id ? null : id;
  renderOrdini();
}

function cambiaQta(fId, pId, delta){
  if(!ordineAttivo[fId]) ordineAttivo[fId]={};
  const nuova = Math.max(0, (ordineAttivo[fId][pId]||0) + delta);
  ordineAttivo[fId][pId] = nuova;
  const el = document.getElementById(`qta_${fId}_${pId}`);
  if(el) el.textContent = nuova;
  // Aggiorna riepilogo se visibile
  const hasItems = Object.values(ordineAttivo).some(f=>Object.values(f).some(v=>v>0));
  if(hasItems) renderOrdini();
}

function resetOrdine(){
  ordineAttivo={};
  ordineNote={};
  fornitoreSelezionato=null;
  renderOrdini();
}

// PWA Install
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  $('installBtn').style.display = 'flex';
});
window.addEventListener('appinstalled', () => {
  $('installBtn').style.display = 'none';
  deferredPrompt = null;
});
async function installApp() {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  deferredPrompt = null;
  if(outcome==='accepted') $('installBtn').style.display='none';
}

}

const isInStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
if(isIOS && !isInStandaloneMode) {
  setTimeout(()=>{ $('iosBanner').style.display='block'; }, 2000);
}
