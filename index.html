<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Don Basilico - Riepilogo</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Don Basilico">
<link rel="apple-touch-icon" href="/icon-192.png">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;color:#1e293b}

/* LOGIN */
.login-bg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(135deg,#0f172a 0%,#1e293b 60%,#0f3460 100%)}
.login-box{background:#fff;border-radius:24px;padding:36px 28px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .emoji{font-size:52px}
.login-logo h1{font-size:26px;font-weight:900;color:#0f172a;margin-top:8px}
.login-logo p{font-size:13px;color:#94a3b8;margin-top:4px}

/* SEDE LIST */
.sede-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.sede-btn{padding:14px 8px;border-radius:14px;border:2px solid #e2e8f0;background:#f8fafc;cursor:pointer;text-align:center;transition:all .15s;font-size:12px;font-weight:700;color:#475569;line-height:1.3}
.sede-btn:active,.sede-btn.selected{border-color:var(--c);background:var(--cb);color:var(--c)}
.sede-btn .sede-icon{font-size:22px;display:block;margin-bottom:4px}

/* PIN */
.pin-section{margin-top:20px}
.pin-label{font-size:12px;font-weight:700;color:#64748b;margin-bottom:10px;text-align:center;letter-spacing:.5px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:20px}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid #cbd5e1;background:#f1f5f9;transition:all .15s}
.pin-dot.filled{background:#6366f1;border-color:#6366f1}
.pin-dot.error{background:#ef4444;border-color:#ef4444}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num-btn{padding:18px 8px;border-radius:14px;border:none;background:#f1f5f9;font-size:22px;font-weight:700;color:#0f172a;cursor:pointer;transition:all .15s;-webkit-user-select:none}
.num-btn:active{background:#e2e8f0;transform:scale(.96)}
.num-btn.del{font-size:18px;color:#94a3b8}
.num-btn.empty{background:transparent;pointer-events:none}
.back-btn{width:100%;margin-top:14px;padding:12px;border-radius:10px;border:none;background:#f1f5f9;color:#64748b;font-size:14px;font-weight:700;cursor:pointer}
.err-msg{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;font-size:13px;text-align:center;margin-bottom:12px}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh;background:#f8fafc}
.topbar{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0;background:#fff;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.topbar-info{display:flex;align-items:center;gap:10px}
.topbar-emoji{font-size:24px}
.topbar-title{font-size:15px;font-weight:800;color:#0f172a}
.topbar-sede{font-size:11px;font-weight:700;margin-top:1px}
.logout-btn{padding:7px 14px;border-radius:10px;border:1px solid #e2e8f0;background:transparent;color:#64748b;font-size:12px;cursor:pointer;font-weight:700}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0}
.tab{flex:1;padding:13px 6px;text-align:center;font-size:12px;font-weight:700;color:#94a3b8;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tab.active{color:#6366f1;border-bottom-color:#6366f1;background:#f8fafc}
.content{padding:16px 14px 80px;flex:1}

/* CARDS */
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card-title{font-size:11px;font-weight:800;color:#94a3b8;margin-bottom:14px;text-transform:uppercase;letter-spacing:.8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.fl{font-size:10px;font-weight:700;color:#64748b;margin-bottom:4px;letter-spacing:.3px}
.fi{width:100%;padding:10px 10px;border-radius:10px;border:1.5px solid #e2e8f0;background:#f8fafc;color:#1e293b;font-size:15px;outline:none;transition:border .2s;-webkit-appearance:none}
.fi:focus{border-color:#6366f1}
textarea.fi{resize:vertical}
.save-btn{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:16px;font-weight:900;cursor:pointer;margin-top:4px;letter-spacing:.3px}
.save-btn:active{opacity:.85}

/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border-radius:14px;padding:16px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stat-val{font-size:20px;font-weight:900;color:#0f172a}
.stat-lbl{font-size:10px;color:#64748b;margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.stat-sub{font-size:11px;color:#94a3b8;margin-top:2px}
.row-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #1e293b}
.row-item:last-child{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:13px 24px;border-radius:14px;font-weight:800;font-size:14px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap;transition:opacity .3s}
</style>
</head>

// Direct REST API - no supabase client needed
async function dbSelect(table, params={}) {
  const qp = ['select=*'];
  if(params.eq) Object.entries(params.eq).forEach(([k,v]) => qp.push(`${k}=eq.${encodeURIComponent(v)}`));
  if(params.order) qp.push(`order=${params.order}`);
  if(params.limit) qp.push(`limit=${params.limit}`);
  const url = `${SUPA_URL}/rest/v1/${table}?${qp.join('&')}`;
  const r = await fetch(url, { headers: {
    'apikey': SUPA_KEY,
    'Authorization': `Bearer ${SUPA_KEY}`
  }});
  const text = await r.text();
  if(!r.ok) throw new Error(text);
  return JSON.parse(text);
}

async function dbUpsert(table, row) {
  const url = `${SUPA_URL}/rest/v1/${table}`;
  const r = await fetch(url, {
    method: 'POST',
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': `Bearer ${SUPA_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify(row)
  });
  if(r.status >= 400) { const e=await r.text(); throw new Error(e); }
  return {};
}

// ─── STATS ────────────────────────────────────────────────────────────────────
let statsPeriod = 'mese';
let statsCustomFrom = '';
let statsCustomTo = '';

function getPeriodDates(period) {
  const now = new Date();
  const to = now.toISOString().slice(0,10);
  let from;
  if(period==='7gg') { const d=new Date(now); d.setDate(d.getDate()-7); from=d.toISOString().slice(0,10); }
  else if(period==='mese') { const d=new Date(now); d.setDate(d.getDate()-30); from=d.toISOString().slice(0,10); }
  else if(period==='3mesi') { const d=new Date(now); d.setMonth(d.getMonth()-3); from=d.toISOString().slice(0,10); }
  else if(period==='anno') { const d=new Date(now); d.setFullYear(d.getFullYear()-1); from=d.toISOString().slice(0,10); }
  else if(period==='tutto') { from='2020-01-01'; }
  else if(period==='custom') { from=statsCustomFrom; }
  return {from, to: period==='custom' ? statsCustomTo : to};
}

    <div class="stat-card" style="border-color:#f59e0b33">
      <div class="stat-val" style="color:#f59e0b">€${fmt(totIncPiz)}</div>
      <div class="stat-lbl">Incasso Pizzeria</div>
    </div>
    <div class="stat-card" style="border-color:#ef444433">
      <div class="stat-val" style="color:#ef4444">€${fmt(totIncJE)}</div>
      <div class="stat-lbl">Incasso Just Eat</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${fmt(totPizze)}</div>
      <div class="stat-lbl">Pizze Totali</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${fmt(totCons)}</div>
      <div class="stat-lbl">Consegne</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">€${fmt(totSpese)}</div>
      <div class="stat-lbl">Spese Totali</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${fmt(Math.round(totPizze/Math.max(giorni,1)))}</div>
      <div class="stat-lbl">Pizze/Giorno</div>
    </div>
  </div>`;

  // Grafico incasso nel tempo (SVG semplice)
  if(rows.length > 1){
    const maxInc = Math.max(...rows.map(r=>(parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0)));
    const W=320, H=120, PAD=8;
    const points = rows.map((r,i)=>{
      const x = PAD + (i/(rows.length-1))*(W-PAD*2);
      const val = (parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0);
      const y = H - PAD - (val/maxInc)*(H-PAD*2);
      return `${x},${y}`;
    }).join(' ');
    const area = `${PAD},${H-PAD} ` + points + ` ${W-PAD},${H-PAD}`;
    
    html += `<div class="card">
      <div class="card-title">Incasso nel Tempo</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">
        <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
        </linearGradient></defs>
        <polygon points="${area}" fill="url(#g1)"/>
        <polyline points="${points}" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round"/>
        ${rows.filter((_,i)=>i===0||i===rows.length-1||i===Math.floor(rows.length/2)).map((r,_,arr)=>{
          const idx = rows.indexOf(r);
          const x = PAD + (idx/(rows.length-1))*(W-PAD*2);
          const val = (parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0);
          const y = H - PAD - (val/maxInc)*(H-PAD*2);
          return `<circle cx="${x}" cy="${y}" r="3" fill="#6366f1"/>
          <text x="${x}" y="${H}" font-size="8" fill="#94a3b8" text-anchor="middle">${r.date.slice(5)}</text>`;
        }).join('')}
      </svg>
    </div>`;
  }

  // Confronto sedi (solo admin)
  if(isAdmin){
    html += `<div class="card"><div class="card-title">Confronto Sedi</div>`;
    const maxSede = Math.max(...SEDI.filter(s=>!s.admin).map(s=>{
      const r2=rows.filter(r=>r.pizzeria===DB_NAME[s.id]);
      return r2.reduce((a,r)=>a+(parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0),0);
    }));
    SEDI.filter(s=>!s.admin).forEach(s=>{
      const r2=rows.filter(r=>r.pizzeria===DB_NAME[s.id]);
      if(!r2.length) return;
      const inc=r2.reduce((a,r)=>a+(parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0),0);
      const pct = maxSede>0 ? (inc/maxSede*100) : 0;
      const pizze=r2.reduce((a,r)=>a+(parseInt(r.pizze_pizzeria)||0)+(parseInt(r.pizze_just_eat)||0),0);
      html+=`<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:12px;font-weight:700;color:#0f172a">${s.emoji} ${s.name}</span>
          <span style="font-size:12px;font-weight:900;color:#0f172a">€${fmt(inc)}</span>
        </div>
        <div style="background:#f1f5f9;border-radius:6px;height:8px;overflow:hidden">
          <div style="background:${s.color};width:${pct}%;height:100%;border-radius:6px;transition:width .5s"></div>
        </div>
        <div style="font-size:10px;color:#64748b;margin-top:2px">${r2.length}gg · ${fmt(pizze)} pizze · media €${fmt(r2.length>0?inc/r2.length:0)}/gg</div>
      </div>`;
    });
    html += '</div>';
  }

  // Ultimi inserimenti
  const recent = [...rows].reverse().slice(0,10);
  html += `<div class="card"><div class="card-title">Ultimi Inserimenti</div>`;
  recent.forEach(r=>{
    const sede=SEDI.find(s=>DB_NAME[s.id]===r.pizzeria)||{color:'#6366f1',emoji:'🍕',name:r.pizzeria};
    const inc=(parseFloat(r.incasso)||0)+(parseFloat(r.incasso_just_eat)||0);
    const pizze=(parseInt(r.pizze_pizzeria)||0)+(parseInt(r.pizze_just_eat)||0);
    html+=`<div class="row-item">
      <div>
        <div style="font-size:13px;font-weight:800;color:#0f172a">${r.date}</div>
        ${isAdmin?`<span class="badge" style="background:${sede.color}22;color:${sede.color};font-size:10px">${sede.emoji} ${sede.name}</span>`:''}
      </div>
      <div style="text-align:right">
        <div style="font-weight:900;color:#f1f5f9">€${fmt(inc)}</div>
        <div style="font-size:11px;color:#64748b">${fmt(pizze)} pizze</div>
      </div>
    </div>`;
  });
  html += '</div>';

  $('mainContent').innerHTML = html;
}

      <div><div class="fl">RAGAZZI</div><input class="fi" type="number" id="f_ragazzi" placeholder="0" inputmode="numeric"></div>

  </div>
  <div class="card">
    <div class="card-title">POS</div>

      <div><div class="fl">POS DOMICILIO</div><input class="fi" type="number" id="f_dom" placeholder="0" inputmode="numeric"></div>
      <div><div class="fl">POS JUST EAT</div><input class="fi" type="number" id="f_je" placeholder="0" inputmode="numeric"></div>
    </div>
    <div class="row2">
      <div><div class="fl">POS PIZZERIA</div><input class="fi" type="number" id="f_piz" placeholder="0" inputmode="numeric"></div>
      <div><div class="fl">ANNULLATI</div><input class="fi" type="number" id="f_ann" placeholder="0" inputmode="numeric"></div>

  </div>
  <div class="card">
    <div class="card-title">Produzione</div>

      <div><div class="fl">PIZZE BABY</div><input class="fi" type="number" id="f_pizze_baby" placeholder="0" inputmode="numeric"></div>

      <div><div class="fl">CONSEGNE JUST EAT</div><input class="fi" type="number" id="f_cons_je" placeholder="0" inputmode="numeric"></div>
      <div><div class="fl">CONSEGNE PIZZERIA</div><input class="fi" type="number" id="f_cons_piz" placeholder="0" inputmode="numeric"></div>
    </div>
    <div class="row2">
      <div><div class="fl">PIZZE CONSEGNATE</div><input class="fi" type="number" id="f_pizze" placeholder="0" inputmode="numeric"></div>
      <div><div class="fl">PIZZE JUST EAT</div><input class="fi" type="number" id="f_pizze_je" placeholder="0" inputmode="numeric"></div>
    </div>
    <div class="row2">
      <div><div class="fl">COMANDE PV</div><input class="fi" type="number" id="f_comande_pv" placeholder="0" inputmode="numeric"></div>
      <div><div class="fl">NUM PIZZE PV</div><input class="fi" type="number" id="f_num_pizze_pv" placeholder="0" inputmode="numeric"></div>
    </div>
    <div style="margin-top:8px">
      <div class="fl">TOTALE PIZZE GIORNALIERO</div>
      <div id="f_tot_pizze" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid #6366f1;background:#f0f0ff;color:#4338ca;font-size:18px;font-weight:900;text-align:center">0</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Cassa</div>
    <div class="row2">
      <div><div class="fl">IMPORTO VERDE €</div><input class="fi" type="number" id="f_importo_verde" placeholder="0.00" step="0.01" inputmode="decimal"></div>
      <div><div class="fl">PUNTO PIZZA €</div><input class="fi" type="number" id="f_punto_pizza" placeholder="0.00" step="0.01" inputmode="decimal"></div>
    </div>
    <div class="row2">
      <div><div class="fl">PUNTO JUST EAT €</div><input class="fi" type="number" id="f_punto_je" placeholder="0.00" step="0.01" inputmode="decimal"></div>
      <div><div class="fl">INCASSO €</div><input class="fi" type="number" id="f_inc" placeholder="0.00" step="0.01" inputmode="decimal"></div>

      <div><div class="fl">MONETE €</div><input class="fi" type="number" id="f_monete" placeholder="0.00" step="0.01" inputmode="decimal"></div>
      <div><div class="fl">PAC €</div><input class="fi" type="number" id="f_pac" placeholder="0.00" step="0.01" inputmode="decimal"></div>

    <div style="margin-top:8px">

      <div id="f_valore_medio" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid #10b981;background:#f0fdf4;color:#047857;font-size:18px;font-weight:900;text-align:center">€ 0.00</div>
    </div>

  const calcFields = ['f_pizze_je','f_pizze','f_num_pizze_pv','f_pizze_baby','f_pizze_maxi'];
  function calcTotale(){
    const je    = parseInt($('f_pizze_je')?.value)||0;
    const cons  = parseInt($('f_pizze')?.value)||0;
    const pv    = parseInt($('f_num_pizze_pv')?.value)||0;
    const baby  = parseInt($('f_pizze_baby')?.value)||0;
    const maxi  = parseInt($('f_pizze_maxi')?.value)||0;
    const tot = je + cons + pv + baby + (maxi * 2);
    if($('f_tot_pizze')) $('f_tot_pizze').textContent = tot;
    // Valore medio pizza = incasso / totale pizze
    const incasso = parseFloat($('f_inc')?.value)||0;
    const vm = tot > 0 ? (incasso / tot) : 0;
    if($('f_valore_medio')) $('f_valore_medio').textContent = '€ ' + vm.toFixed(2);
  }
  const allCalcFields = [...calcFields, 'f_inc'];
  allCalcFields.forEach(id => {
    const el = $(id);
    if(el) el.addEventListener('input', calcTotale);
  });
  calcTotale();
}

async function saveForm(){
  const btn=$('saveBtn'); btn.disabled=true; btn.textContent='Salvataggio...';
  const sedeId = currentSede.admin ? $('f_sede').value : currentSede.id;

  // Blocco 48h per i gestori (non admin)
  if(!currentSede.admin) {
    const selectedDate = new Date($('f_date').value);
    const now = new Date();
    const diffHours = (now - selectedDate) / (1000 * 60 * 60);
    if(diffHours > 48) {
      toast('⛔ Oltre 48h — solo Admin può modificare', '#ef4444');
      btn.disabled=false; btn.textContent='💾 Salva Riepilogo';
      return;
    }
  }
  const row={
    pizzeria: DB_NAME[sedeId],
    date: $('f_date').value,
    fc: parseInt($('f_fc').value)||0,
    ragazzi: parseInt($('f_ragazzi').value)||0,
    pos_domicilio: parseInt($('f_dom').value)||0,
    pos_just_eat: parseInt($('f_je').value)||0,
    pos_pizzeria: parseInt($('f_piz').value)||0,
    annullati: parseInt($('f_ann').value)||0,
    consegne_just_eat: parseInt($('f_cons_je').value)||0,
    consegne_pizzeria: parseInt($('f_cons_piz').value)||0,
    pizze_piatto: (parseInt($('f_pizze_je').value)||0) + (parseInt($('f_pizze').value)||0) + (parseInt($('f_num_pizze_pv').value)||0) + (parseInt($('f_pizze_baby').value)||0) + ((parseInt($('f_pizze_maxi').value)||0)*2),
    pizze_maxi: parseInt($('f_pizze_maxi').value)||0,
    pizze_baby: parseInt($('f_pizze_baby').value)||0,
    consegne_just_eat: parseInt($('f_cons_je').value)||0,
    consegne_pizzeria: parseInt($('f_cons_piz').value)||0,
    pizze_pizzeria: parseInt($('f_pizze').value)||0,
    pizze_just_eat: parseInt($('f_pizze_je').value)||0,
    comande_pv: parseInt($('f_comande_pv').value)||0,
    num_pizze_pv: parseInt($('f_num_pizze_pv').value)||0,
    importo_verde: parseFloat($('f_importo_verde').value)||0,
    punto_pizza: parseFloat($('f_punto_pizza').value)||0,
    punto_just_eat: parseFloat($('f_punto_je').value)||0,
    incasso: parseFloat($('f_inc').value)||0,
    incasso_just_eat: parseFloat($('f_inc_je').value)||0,
    chiusura_fiscale: parseFloat($('f_imp').value)||0,
    banconote: parseFloat($('f_cont').value)||0,
    monete: parseFloat($('f_monete').value)||0,
    pac: parseFloat($('f_pac').value)||0,
    spese: parseFloat($('f_spese').value)||0,
    note: $('f_note').value,
  };
  try { 
    await dbUpsert('riepilogo_daily', row);
    toast('✓ Salvato!'); 
    showTab('stats');
  } catch(e) { 
    toast('Errore: '+e.message,'#ef4444');
  }
  btn.disabled=false; btn.textContent='💾 Salva Riepilogo';
}

// INIT
renderSedi();
// PWA Install
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  $('installBtn').style.display = 'flex';
});
window.addEventListener('appinstalled', () => {
  $('installBtn').style.display = 'none';
  deferredPrompt = null;
});
async function installApp() {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  deferredPrompt = null;
  if(outcome==='accepted') $('installBtn').style.display='none';
}

// Register Service Worker
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
